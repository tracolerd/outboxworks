<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OutboxWorks Dashboard</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; margin: 0; padding: 20px; color: #1f2937; }
    h1 { text-align: center; color: #111827; }
    .container { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; font-size: 1.25rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.875rem; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e5e7eb; }
    th { background-color: #f9fafb; color: #6b7280; font-weight: 600; }
    .badge { padding: 4px 8px; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; display: inline-block; }
    .status-PENDING { background-color: #fef3c7; color: #92400e; }
    .status-DELIVERED { background-color: #d1fae5; color: #065f46; }
    .status-DEAD_LETTERED { background-color: #fee2e2; color: #991b1b; }
    .status-SCHEDULED { background-color: #e0e7ff; color: #3730a3; }
    .refresh-btn { display: block; margin: 0 auto 20px; padding: 10px 20px; background-color: #4f46e5; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    .refresh-btn:hover { background-color: #4338ca; }
  </style>
</head>
<body>
  <h1>📦 OutboxWorks Monitoring</h1>
  <input type="password" id="adminToken" placeholder="Enter Admin Secret" style="display:block;margin:0 auto 10px;padding:8px;" /><button class="refresh-btn" onclick="loadData()">Refresh Data</button>
  <div class="container">
    <div class="card">
      <h2>Registered Endpoints</h2>
      <table>
        <thead><tr><th>URL</th><th>Created At</th></tr></thead>
        <tbody id="endpoints-body"><tr><td colspan="2">Loading...</td></tr></tbody>
      </table>
    </div>
    <div class="card">
      <h2>Recent Deliveries</h2>
      <table>
        <thead><tr><th>Status</th><th>URL</th><th>Attempts</th><th>Last Updated</th></tr></thead>
        <tbody id="deliveries-body"><tr><td colspan="4">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
  <script>
    async function loadData() {
      try {
        const [epRes, delRes] = await Promise.all([ fetch('/api/endpoints'), fetch('/api/deliveries') ]);
        const endpoints = await epRes.json();
        const deliveries = await delRes.json();
        const epBody = document.getElementById('endpoints-body');
        epBody.innerHTML = endpoints.map(ep => `<tr><td>${ep.url}</td><td>${new Date(ep.created_at).toLocaleString()}</td></tr>`).join('');
        if(endpoints.length === 0) epBody.innerHTML = '<tr><td colspan="2">No endpoints found.</td></tr>';
        const delBody = document.getElementById('deliveries-body');
        delBody.innerHTML = deliveries.map(d => `<tr>
          <td><span class="badge status-${d.status}">${d.status}</span></td>
          <td>${d.url}</td>
          <td>${d.attempt_count}</td>
          <td>${new Date(d.updated_at).toLocaleString()}</td>
        </tr>`).join('');
        if(deliveries.length === 0) delBody.innerHTML = '<tr><td colspan="4">No deliveries found.</td></tr>';
      } catch (error) {
        alert('Failed to load data from API.');
      }
    }
    window.onload = loadData;
  </script>
</body>
</html>
