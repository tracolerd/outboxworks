<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OutboxWorks Monitoring Dashboard</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; margin: 0; padding: 20px; color: #1f2937; }
    h1 { text-align: center; color: #111827; }
    .container { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; font-size: 1.25rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.875rem; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e5e7eb; }
    th { background-color: #f9fafb; color: #6b7280; font-weight: 600; }
    .badge { padding: 4px 8px; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; display: inline-block; }
    .status-PENDING { background-color: #fef3c7; color: #92400e; }
    .status-DELIVERED { background-color: #d1fae5; color: #065f46; }
    .status-DEAD_LETTERED { background-color: #fee2e2; color: #991b1b; }
    .status-SCHEDULED { background-color: #e0e7ff; color: #3730a3; }
    .status-IN_PROGRESS { background-color: #e5e7eb; color: #374151; }
    .controls { max-width: 400px; margin: 0 auto 20px; display: flex; gap: 10px; }
    input[type="password"] { flex: 1; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; }
    .refresh-btn { padding: 10px 20px; background-color: #4f46e5; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    .refresh-btn:hover { background-color: #4338ca; }
    .error-msg { color: #dc2626; text-align: center; font-weight: 500; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>📦 OutboxWorks Monitoring</h1>
  <div class="controls">
    <input type="password" id="adminToken" placeholder="Enter Admin Secret Token" />
    <button class="refresh-btn" onclick="loadData()">Load Data</button>
  </div>
  <div id="errorContainer" class="error-msg"></div>
  <div class="container">
    <div class="card">
      <h2>Registered Endpoints</h2>
      <table>
        <thead><tr><th>URL</th><th>Created At</th></tr></thead>
        <tbody id="endpoints-body"><tr><td colspan="2">Please enter token and load data.</td></tr></tbody>
      </table>
    </div>
    <div class="card">
      <h2>Recent Deliveries</h2>
      <table>
        <thead><tr><th>Status</th><th>URL</th><th>Attempts</th><th>Last Updated</th></tr></thead>
        <tbody id="deliveries-body"><tr><td colspan="4">Please enter token and load data.</td></tr></tbody>
      </table>
    </div>
  </div>
  <script>
    async function loadData() {
      const token = document.getElementById('adminToken').value.trim();
      const errBox = document.getElementById('errorContainer');
      errBox.textContent = '';
      if (!token) {
        errBox.textContent = 'Admin token is required.';
        return;
      }
      const headers = { 'Authorization': 'Bearer ' + token };
      try {
        const [epRes, delRes] = await Promise.all([
          fetch('/api/endpoints', { headers }),
          fetch('/api/deliveries', { headers })
        ]);
        if (epRes.status === 401 || delRes.status === 401) {
          errBox.textContent = 'Unauthorized: Invalid Admin Secret Token.';
          return;
        }
        if (!epRes.ok || !delRes.ok) {
          throw new Error('Failed to fetch monitoring data.');
        }
        const endpoints = await epRes.json();
        const deliveries = await delRes.json();
        // Safe DOM Rendering (Preventing XSS)
        const epBody = document.getElementById('endpoints-body');
        epBody.innerHTML = '';
        if (endpoints.length === 0) {
          epBody.innerHTML = '<tr><td colspan="2">No endpoints found.</td></tr>';
        } else {
          endpoints.forEach(ep => {
            const tr = document.createElement('tr');
            const tdUrl = document.createElement('td');
            tdUrl.textContent = ep.url; // Safe text rendering
            const tdDate = document.createElement('td');
            tdDate.textContent = new Date(ep.created_at).toLocaleString();
            tr.appendChild(tdUrl);
            tr.appendChild(tdDate);
            epBody.appendChild(tr);
          });
        }
        const delBody = document.getElementById('deliveries-body');
        delBody.innerHTML = '';
        if (deliveries.length === 0) {
          delBody.innerHTML = '<tr><td colspan="4">No deliveries found.</td></tr>';
        } else {
          deliveries.forEach(d => {
            const tr = document.createElement('tr');
            const tdStatus = document.createElement('td');
            const badge = document.createElement('span');
            badge.className = `badge status-${d.status}`;
            badge.textContent = d.status;
            tdStatus.appendChild(badge);
            const tdUrl = document.createElement('td');
            tdUrl.textContent = d.url; // Safe text rendering
            const tdAttempts = document.createElement('td');
            tdAttempts.textContent = d.attempt_count;
            const tdDate = document.createElement('td');
            tdDate.textContent = new Date(d.updated_at).toLocaleString();
            tr.appendChild(tdStatus);
            tr.appendChild(tdUrl);
            tr.appendChild(tdAttempts);
            tr.appendChild(tdDate);
            delBody.appendChild(tr);
          });
        }
      } catch (error) {
        errBox.textContent = error.message;
      }
    }
  </script>
</body>
</html>
