<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
  <title id="title">OutboxWorks — Reliable Webhook Delivery</title>
  <desc id="desc">A dark teal technical banner showing an event moving through a durable queue into monitored webhook delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081521"/>
      <stop offset="0.52" stop-color="#0b2530"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#0f766e" stop-opacity=".48"/>
      <stop offset="1" stop-color="#0f766e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1440" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1440" height="360" rx="24" fill="url(#grid)"/>
  <ellipse cx="1090" cy="158" rx="420" ry="300" fill="url(#glow)"/>
  <path d="M0 300C220 240 330 358 560 295S880 216 1080 282s244 52 360-2" fill="none" stroke="#2dd4bf" stroke-opacity=".22" stroke-width="2"/>
  <path d="M0 320C230 260 345 378 590 315s332-68 518-12 230 44 332 5" fill="none" stroke="#60a5fa" stroke-opacity=".14" stroke-width="2"/>
