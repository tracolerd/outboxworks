    <text x="0" y="166" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#cbd5e1">Durable events. Observable retries.</text>
    <text x="0" y="198" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#cbd5e1">Explicit failure states.</text>
  </g>
